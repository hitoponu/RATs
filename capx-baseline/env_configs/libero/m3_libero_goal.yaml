# M3 tier on LIBERO-goal -- condition 1 of the M3-vs-RATS comparison.
#
# CaP-Bench M3 (paper Table 1) = noisy perception x HIGH-LEVEL primitives x
# multi-turn x Visual Differencing Module. In cap-x's config vocabulary that is
# the `*_multiturn_vdm.yaml` shape, which exists for robosuite tasks but not for
# LIBERO -- hence this file. Concretely:
#
#   apis: FrankaLiberoApi          -> S2/high-level (NOT ...Reduced*, which is S3/S4)
#   use_img_differencing: true     -> VDM
#   multi_turn_prompt              -> multi-turn with stdout/stderr traces
#   use_parallel_ensemble/multimodel: false -> no CaP-Agent0 parallel reasoning
#
# Skill-library variants live in m3_libero_goal_{iter050,playskills}.yaml.
#
# Usage (task_id is set here; vary it per run):
#   python capx/envs/launch.py --config-path env_configs/libero/m3_libero_goal.yaml \
#     --model Qwen/Qwen3.6-27B --server-url <vllm>/v1/chat/completions \
#     --visual-differencing-model Qwen/Qwen3.6-27B \
#     --visual-differencing-model-server-url <vllm>/v1/chat/completions \
#     --total-trials 4 --num-workers 4

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_goal
      task_id: 0
      privileged: false
      max_steps: 8000
      control_freq: 20
    privileged: false
    apis:
      - FrankaLiberoApi
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: {libero_environment_goal}
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/m3_libero_goal
use_img_differencing: true
save_multiturn_prompts: true
# M3 is a single-query tier: CaP-Agent0's parallel reasoning is what separates
# it from the "Full system" arms, so it must stay off here.
use_parallel_ensemble: false
use_multimodel: false
# Freeze the library: this arm has none, and cap-x's own auto-synthesis would
# otherwise grow one mid-run and confound the no-skill baseline.
evolve_skill_library: false

trials: 4
num_workers: 4
