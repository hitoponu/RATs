# Step-growth arm (RATS play): oracle step judgement + step-level skill credit
# + step-level skill extraction. Inert unless RATS_STEP_GROWTH=1.
# Override this file with RATS_STEP_GROWTH_CONFIG=<path>.
oracle:
  lift_dz_m: 0.03                 # matches FrankaLiberoEnv._PICK_LIFT_M
  grasp_end_dz_m: 0.005           # boundary grasp check: contact + closed gripper + 5 mm
  gripper_closed_max_fraction: 0.6
  persist_sidecar: true           # iteration_NNN/attempt_NN/step_oracle.json
  oracle_to_diagnoser: false      # C2 extension; NOT wired in v1, keep false
milestones:
  near_radius_m: 0.10             # transport milestone near(a, b): xy radius
  near_z_tolerance_m: 0.02
  multi_chain: max_time           # multi-predicate goals: t* = max over chains
credit:
  tier_policy: step               # step | task
  promote_min_step_uses: 3
  promote_min_step_sr: 0.6
  deprecate_min_step_uses: 8
  deprecate_max_step_sr: 0.2
curation:
  # The MemoryCurator decides which learned skills survive. Its default prompt
  # only knows the task-level counters, so in run1 (job 5252020) it deprecated
  # 3 of the 4 skills this arm extracted -- one of them at step 1/1 -- because
  # they all read as usage_count=0, success_count=0. This copy tells it the
  # step record exists. Set to "" to go back to the curator's own prompt.
  curator_prompt_path: rats/prompts/skill_curator_step_growth.txt
extraction:
  enabled: true
  max_per_iteration: 1
  max_per_run: 200
  only_on_failed_iteration: true
  model: null                     # null -> RATS_STEP_SKILL_EXTRACTOR_MODEL or the loop default
  min_prefix_lines: 3
  max_prefix_lines: 200
  max_skill_lines: 80
