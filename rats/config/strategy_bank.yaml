# Physical strategy families for the DIVERSITY half of the step-growth arm
# (section B of the 2026-09-08 plan). Inert unless RATS_STEP_GROWTH=1 AND
# diversity is on (RATS_STEP_GROWTH_DIVERSITY=1 or diversity.enabled in
# rats/config/step_growth.yaml).
#
# Why this file exists: in play_qwen38_reduced/run1, 45 of 50 attempt-0 codes
# hard-coded the identity quaternion [1,0,0,0] with a mask-centroid position,
# and from iter4 on the planner explicitly told the writer "do NOT use
# plan_grasp" (28/50). One strategy crowded out every other, so failures kept
# repeating the same physics. A directive drawn from this bank is injected in
# the writer's priority-0 slot to keep several physical strategies alive.
#
# An entry is:
#   id          unique family id (also the strategy_tag on skills it produces)
#   step_types  which milestone types it can be selected for
#               (grasp | place | open_close | turn | localize)
#   directive   <=250 chars, high-level PHYSICAL strategy. Naming primitives is
#               deliberate: countering "do NOT use plan_grasp" is the point.
#   requires    every name must be in the env's available_functions, else the
#               family is skipped for this run (reduced API has no wrist tools)
#   forbids     extra MUST-NOT lines rendered under this family
#   tags        free-form; code_fingerprint votes a family from these
version: 1

# Appended to every rendered directive regardless of family.
common_forbids:
  - "Do NOT hard-code an identity quaternion ([1,0,0,0] or [0,0,0,1]) as a grasp orientation. Derive orientation from plan_grasp / plan_grasp_from_point_clouds or from the object's oriented bounding box."
  - "Do NOT skip perception: every target pose must be computed from a segmentation / point / grasp call made in THIS attempt, not from remembered coordinates."

families:
  # ----------------------------------------------------------- grasp (5)
  - id: graspnet_6dof
    step_types: [grasp]
    directive: >-
      Take the grasp pose from plan_grasp(depth, intrinsics, segmap) on the target's SAM3 mask,
      transform the top-scoring 4x4 to world with obs["agentview"]["pose_mat"], and execute BOTH its
      position and rotation via goto_pose(pos, quat, z_approach=0.10).
    requires: [get_observation, plan_grasp, goto_pose, close_gripper]
    forbids:
      - "Do NOT replace the planner's rotation with a top-down guess after asking for it."
    tags: [graspnet, six_dof, plan_grasp]

  - id: graspnet_pointcloud_topk
    step_types: [grasp]
    directive: >-
      Back-project the masked depth to 3D and call plan_grasp_from_point_clouds(pc_full, pc_segment)
      on a filter_noise / subsample_point_cloud-cleaned cloud. Among the top-scoring candidates prefer
      one whose approach axis is within ~45 deg of vertical.
    requires: [get_observation, plan_grasp_from_point_clouds, goto_pose, close_gripper]
    forbids: []
    tags: [graspnet, point_cloud, plan_grasp]

  - id: obb_topdown_yaw
    step_types: [grasp]
    directive: >-
      Build the object's point cloud from its mask, call get_oriented_bounding_box_from_3d_points, and
      grasp top-down with the fingers across the SHORT horizontal axis: yaw from the OBB rotation R,
      height from center + extent/2, then descend and close.
    requires: [get_observation, get_oriented_bounding_box_from_3d_points, goto_pose, close_gripper]
    forbids:
      - "Do NOT use the raw mask centroid as the grasp point; use the OBB centre and axes."
    tags: [obb, obb_yaw, top_down]

  - id: molmo_point_side_pinch
    step_types: [grasp]
    directive: >-
      Locate the target with point_prompt_molmo, turn that pixel into a mask with
      segment_sam3_point_prompt, then pinch from the SIDE: approach horizontally at the object's
      mid-height toward its centre, close there, and lift. Never descend from above.
    requires: [get_observation, point_prompt_molmo, segment_sam3_point_prompt, goto_pose, close_gripper]
    forbids: []
    tags: [molmo, side_pinch]

  - id: ik_waypoint_chain
    step_types: [grasp]
    directive: >-
      Compute the grasp pose as usual, then execute it as an explicit chain: solve_ik +
      move_to_joints for a pre-grasp 7-8 cm back along the approach axis, then the grasp pose,
      then close_gripper, then a short retreat. Keep each cartesian hop under ~8 cm.
    requires: [get_observation, solve_ik, move_to_joints, close_gripper]
    forbids:
      - "Do NOT do the whole approach in one long goto_pose; the interpolator is crude over big hops."
    tags: [ik_chain, waypoints]

  # ----------------------------------------------------------- place (3)
  - id: hover_descend_release
    step_types: [place]
    directive: >-
      Place by hovering: keep the carried orientation, move to the destination's XY about 10 cm above
      its measured top surface, descend in one short goto_pose to just above contact, open_gripper,
      then retreat straight up before any other motion.
    requires: [get_observation, goto_pose, open_gripper]
    forbids: []
    tags: [hover, place]

  - id: resegment_after_carry
    step_types: [place]
    directive: >-
      Before releasing, take a FRESH get_observation and re-segment the destination, then recompute
      the drop point from that new mask - the object may have shifted in the hand during the carry.
      Only then descend and open_gripper.
    requires: [get_observation, segment_sam3_text_prompt, goto_pose, open_gripper]
    forbids:
      - "Do NOT reuse the destination pose computed before the object was lifted."
    tags: [resegment, place]

  - id: obb_inside_container
    step_types: [place]
    directive: >-
      Target the destination's interior: segment it, build its point cloud and OBB, and aim at the
      centre of its top face, inset so the carried object clears the rim. Descend to just inside,
      open_gripper, then retreat upward.
    requires: [get_observation, get_oriented_bounding_box_from_3d_points, goto_pose, open_gripper]
    forbids: []
    tags: [obb, container, place]

  # ------------------------------------------------------ open_close (3)
  - id: handle_graspnet_pull
    step_types: [open_close]
    directive: >-
      Grasp the handle itself: segment the handle, run plan_grasp on that mask, close on the
      top-scoring pose, then translate along the opening direction (the handle OBB's long horizontal
      axis) in several short goto_pose moves.
    requires: [get_observation, plan_grasp, goto_pose, close_gripper]
    forbids: []
    tags: [graspnet, handle, plan_grasp]

  - id: push_surface_closed_gripper
    step_types: [open_close]
    directive: >-
      Do not grasp anything: close_gripper first and push the panel with the closed fingertips,
      keeping contact and moving in 2-4 cm increments along the surface normal measured from the
      panel's point cloud.
    requires: [get_observation, goto_pose, close_gripper]
    forbids:
      - "Do NOT open the gripper during this step."
    tags: [push, closed_gripper]

  - id: hook_edge_pull
    step_types: [open_close]
    directive: >-
      Hook the edge: with the gripper closed, place the fingertips just inside the door/drawer lip,
      then pull back along the opening axis in 2-4 cm increments with the wrist orientation fixed.
    requires: [get_observation, goto_pose, close_gripper]
    forbids: []
    tags: [hook, closed_gripper]

  # ------------------------------------------------------------ turn (2)
  - id: knob_pinch_rotate
    step_types: [turn]
    directive: >-
      Pinch the knob: segment it, take its OBB centre, approach along the knob's axis, close_gripper
      on it, then rotate the wrist about that axis by stepping the quaternion through a few
      goto_pose calls rather than one large rotation.
    requires: [get_observation, get_oriented_bounding_box_from_3d_points, goto_pose, close_gripper]
    forbids: []
    tags: [obb, knob, pinch]

  - id: knob_push_tangent
    step_types: [turn]
    directive: >-
      Do not pinch: with the gripper closed, press a fingertip against the knob's rim and push
      tangentially (perpendicular to the radius from the knob centre) in short increments to turn it.
    requires: [get_observation, goto_pose, close_gripper]
    forbids: []
    tags: [push, knob, closed_gripper]

  # -------------------------------------------------------- localize (2)
  # Selected only when per_type_families.localize > 0 (default 0: the grasp
  # family already dictates how the target is found).
  - id: sam3_text
    step_types: [localize]
    directive: >-
      Localize with segment_sam3_text_prompt using a short concrete noun phrase, take the
      highest-score mask, and assert it is non-empty before using it.
    requires: [get_observation, segment_sam3_text_prompt]
    forbids: []
    tags: [sam3, text]

  - id: molmo_then_sam3
    step_types: [localize]
    directive: >-
      Localize with point_prompt_molmo first, then convert that pixel into a mask with
      segment_sam3_point_prompt. Use this when several similar objects would match the text prompt.
    requires: [get_observation, point_prompt_molmo, segment_sam3_point_prompt]
    forbids: []
    tags: [molmo, sam3]
